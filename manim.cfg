# Repo-wide Manim config (read from the cwd: run manim from the repo root; never pass
# --config_file or --encoder-option, which REPLACE these tables instead of merging).
#
# Encode path (docs/PLAN.md §11): every scene is written LOSSLESS in RGB (libx264rgb, qp 0, gbrp)
# — no YUV conversion inside Manim. Scenes are concatenated by stream copy, and ONE final lossy
# encode converts RGB -> BT.709 4:2:0 (tagged bt709). One lossy generation, standard HD colours.
# Verified at Gate 3: accents decode within 3 levels of their theme values after the final encode.
[CLI]
max_files_cached = -1

[video_encoder]
codec = libx264rgb
pixel_format = rgb24

[video_encoder.options]
qp = 0
preset = veryfast
