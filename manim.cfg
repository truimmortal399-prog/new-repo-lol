# Repo-wide Manim config (read from the cwd: run manim from the repo root).
# Partial movies are stream-copied into the scene movie, so their encoder settings ARE the
# master's quality. PyAV converts RGBA with the BT.601 matrix and leaves the stream untagged;
# tag it accordingly so players do not shift the accent colors (Gate 2 recon).
[CLI]
max_files_cached = -1

[video_encoder.options]
crf = 18
colorspace = smpte170m
color_primaries = bt709
color_trc = bt709
color_range = tv
